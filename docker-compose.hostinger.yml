# Caddy, fuera de este archivo, termina HTTPS de api.autobrillo.tech
# y reenvía el tráfico a 127.0.0.1:8080. Ver docs/Caddyfile.ejemplo.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: autobrillo-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      TZ: America/Asuncion
    ports:
      - "127.0.0.1:8080:8080"
